<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - FastFood</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        naranja: "#FFA612",
                        fondo: "#080808",
                        tarjeta: "#181818",
                        input: "#080808"
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-fondo text-white flex items-center justify-center p-4">

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="w-full max-w-[960px] min-h-[650px] border border-[#272727]
                rounded-[20px] overflow-hidden bg-[#090909]">

        <!-- BARRA SUPERIOR -->
        <header class="h-[74px] border-b border-[#242424]
                       flex items-center px-8">

            <!-- LOGO -->
            <img
                src="img/image.png"
                alt="Logo FastFood"
                class="w-[48px] h-[48px] object-contain"
            >

        </header>


        <!-- CONTENIDO -->
        <section class="grid grid-cols-1 md:grid-cols-2
                        gap-8 px-8 md:px-16
                        py-8 md:py-0
                        min-h-[575px]">


            <!-- ========================= -->
            <!-- LADO IZQUIERDO -->
            <!-- ========================= -->

            <div class="flex flex-col justify-center">

                <!-- TÍTULO -->
                <h1 class="text-4xl md:text-[44px] font-bold tracking-tight">
                    Fast<span class="text-naranja">Food</span>
                </h1>

                <!-- DESCRIPCIÓN -->
                <p class="text-white text-xl md:text-[22px]
                          leading-relaxed mt-3">

                    Sabor que te encanta,<br>
                    pedidos que llegan.

                </p>


                
                <!-- IMAGEN -->
                <div class="hidden md:block mt-7">
                
                    <img
                        src="img/fondo.jpeg"
                        alt="Hamburguesa"
                        class="w-full max-w-[350px]
                               h-[310px]
                               object-cover"
                    >
                
                </div>
                

            </div>


            <!-- ========================= -->
            <!-- FORMULARIO -->
            <!-- ========================= -->

            <div class="flex items-center
            justify-center md:justify-end
            w-full">

                        <div class="w-full
                        bg-tarjeta
                        border border-[#272727]
                        rounded-[22px]
                        px-7 py-10">

                    <!-- TÍTULO -->
                    <h2 class="text-center
                               text-3xl
                               font-bold
                               mb-10">

                        Registro

                    </h2>


                    <!-- NOMBRE -->
                    <div class="mb-6">

                        <label class="block
                                      text-[20px]
                                      mb-2">

                            Nombre Usuario

                        </label>


                        <div class="relative">

                            
                            </span>


                            <input
                                type="text"
                                placeholder="Nombre Completo"
                                class="w-full
                                       h-[50px]
                                       bg-input
                                       rounded-[9px]
                                       pl-12
                                       pr-4
                                       text-white
                                       placeholder-gray-500
                                       outline-none
                                       focus:ring-2
                                       focus:ring-naranja"
                            >

                        </div>

                    </div>


                    <!-- CORREO -->
                    <div class="mb-6">

                        <label class="block
                                      text-[20px]
                                      mb-2">

                            Correo electrónico

                        </label>


                        <div class="relative">



                            <input
                                type="email"
                                placeholder="correo@gmail.com"
                                class="w-full
                                       h-[50px]
                                       bg-input
                                       rounded-[9px]
                                       pl-12
                                       pr-4
                                       text-white
                                       placeholder-gray-500
                                       outline-none
                                       focus:ring-2
                                       focus:ring-naranja"
                            >

                        </div>

                    </div>


                    <!-- CONTRASEÑA -->
                    <div class="mb-7">

                        <label class="block
                                      text-[20px]
                                      mb-2">

                            Contraseña

                        </label>


                        <div class="relative">



                            <input
                                type="password"
                                placeholder="Contraseña"
                                class="w-full
                                       h-[50px]
                                       bg-input
                                       rounded-[9px]
                                       pl-12
                                       pr-12
                                       text-white
                                       placeholder-gray-500
                                       outline-none
                                       focus:ring-2
                                       focus:ring-naranja"
                            >
                            

                        </div>

                    </div>


                    <!-- BOTÓN REGISTRAR -->
                    <button
                        type="submit"
                        class="w-full
                               h-[52px]
                               bg-naranja
                               hover:bg-[#ffb52f]
                               text-black
                               font-bold
                               text-[18px]
                               rounded-[9px]
                               transition
                               duration-200
                               hover:scale-[1.01]">

                        Registrar

                    </button>


                    <!-- TEXTO -->
                    <p class="text-center
                              text-white
                              mt-7">

                        ¿Ya tienes una cuenta?

                    </p>


                    <!-- INICIAR SESIÓN -->
                    <a
                        href="../inicioSesion/index.html"
                        class="block
                               text-center
                               text-naranja
                               font-bold
                               mt-6
                               hover:text-[#ffbe4d]
                               transition">

                        Iniciar Sesion

                    </a>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
